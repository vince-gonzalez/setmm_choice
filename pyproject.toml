[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmforge"
version = "0.1.1"
description = "Find avoidable axiom dependencies in Metamath databases, and build the proofs that remove them."
readme = "README-pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Gonzalez", email = "vincegonzalez@me.com" }]
keywords = [
    "metamath",
    "set.mm",
    "formal verification",
    "interactive theorem proving",
    "proof assistant",
    "automated reasoning",
    "axiom of choice",
    "dependency analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vince-gonzalez/mmforge"
Source = "https://github.com/vince-gonzalez/mmforge"
Issues = "https://github.com/vince-gonzalez/mmforge/issues"

[project.scripts]
mmforge = "mmforge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
